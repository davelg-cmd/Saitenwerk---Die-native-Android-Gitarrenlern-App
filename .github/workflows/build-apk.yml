name: Saitenwerk Beta - APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

# Serialize builds so backup commits and release uploads cannot race each other.
concurrency:
  group: saitenwerk-beta-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      # ------------------------------------------------------------
      # 1. Repository auschecken
      # ------------------------------------------------------------
      - name: Repository herunterladen
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Java 17
      # ------------------------------------------------------------
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ------------------------------------------------------------
      # 3. Android SDK
      # ------------------------------------------------------------
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      # ------------------------------------------------------------
      # 4. Android SDK Pakete installieren
      # ------------------------------------------------------------
      - name: Android SDK Pakete installieren
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ------------------------------------------------------------
      # 5. Beta-Projekt finden und entpacken
      # ------------------------------------------------------------
      - name: Letzten geprüften Projektstand entpacken
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_ROOT="$GITHUB_WORKSPACE/build-backups/beta"
          if [ ! -d "$BACKUP_ROOT" ]; then
            echo "FEHLER: Kein Build-Backup-Verzeichnis vorhanden: $BACKUP_ROOT"
            exit 1
          fi

          LATEST_ARCHIVE="$(find "$BACKUP_ROOT" -mindepth 2 -maxdepth 2 -type f -name source-project.tar.gz -printf '%h\n' | sort -V | tail -n 1)"
          if [ -z "$LATEST_ARCHIVE" ]; then
            echo "FEHLER: Kein vollständiges Projekt-Backup gefunden."
            exit 1
          fi

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted-project"
          mkdir -p "$PROJECT_DIR"
          tar -xzf "$LATEST_ARCHIVE/source-project.tar.gz" -C "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "FEHLER: Das entpackte Backup enthält kein Gradle-Projekt."
            exit 1
          fi

          echo "Verwendeter Projektstand: $LATEST_ARCHIVE"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: APK-Download und Versionsprüfung korrigieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/fix_update_download_validation.py

      - name: Bereits installierte APK als abgeschlossen erkennen
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/fix_update_already_installed.py

      - name: BPM-Regler und Taktauswahl ausrichten
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/fix_chord_tempo_layout.py

      - name: Lernstudio optimieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/upgrade_learning_studio.py

      - name: Intelligenten Schlagmuster-Trainer integrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/upgrade_intelligent_strumming_trainer.py

      - name: Intelligenten Schlagmuster-Trainer validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          s = (Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/de/saitenwerk/app/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "Muster vorhören",
              "Jetzt du · Training starten",
              "Anfänger",
              "Grundlagen",
              "Fortgeschritten",
              "Profi",
              "Offbeat",
              "learn_strum_best_combo",
              "learn_strum_best_rounds",
              "Timing-Fenster",
              "GuitarAudioEngine.playChord",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("FEHLER: Schlagmuster-Trainer unvollständig: " + ", ".join(missing))
          start = s.find("        fun showStrumming() {")
          end = s.find("\n        fun showSongPractice() {", start)
          if start < 0 or end < 0:
              raise SystemExit("FEHLER: showStrumming()-Bereich nicht gefunden.")
          trainer = s[start:end]
          if trainer.count("GuitarAudioEngine.playChord") < 3:
              raise SystemExit("FEHLER: Vorschau, Eigenwiedergabe und Nutzer-Feedback nicht vollständig verdrahtet.")
          if "phase == \"play\"" not in trainer or "phase == \"preview\"" not in trainer:
              raise SystemExit("FEHLER: getrennte Vorhör- und Eigenphase fehlt.")
          print("INTELLIGENTER-SCHLAGMUSTER-TRAINER: PASS")
          print("8 Muster, 4 Stufen, Vorhörmodus, Eigenphase, Timingfenster, Serien und Bestwerte geprüft.")
          PY

      - name: Interaktiven Griffbrett-Notentrainer integrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/upgrade_fretboard_note_trainer.py

      - name: Griffbrett-Notentrainer validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          s = (Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/de/saitenwerk/app/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "class FretboardNoteView(context: android.content.Context)",
              "fun showFretboard()",
              "Griffbrett entdecken",
              "Interaktives Gitarrengriffbrett, zwölf Bünde",
              "GuitarAudioEngine.playString(a, string, fret, 0.68f)",
              "learn_fretboard_best_streak",
              "Gesucht:  $targetName",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("FEHLER: Griffbrett-Notentrainer unvollständig: " + ", ".join(missing))
          if s.count("fun showFretboard()") != 1:
              raise SystemExit("FEHLER: showFretboard() mehrfach vorhanden.")
          if s.count("class FretboardNoteView(context: android.content.Context)") != 1:
              raise SystemExit("FEHLER: FretboardNoteView mehrfach vorhanden.")
          print("GRIFFBRETT-NOTENTRAINER: PASS")
          print("12 Bünde, sechs Saiten, Tonausgabe, 10er-Runde, Serienbestwert und Lernstudio-Einstieg geprüft.")
          PY

      - name: Vollständigen Lernfortschritt-Reset integrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/upgrade_complete_learning_reset.py

      - name: Vollständigen Lernfortschritt-Reset validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          s = (Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/de/saitenwerk/app/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              'section("Lernfortschritt"',
              '"Alles zurücksetzen"',
              '"Gesamten Lernfortschritt zurücksetzen?"',
              'learn_daily_seconds',
              'learn_week_seconds',
              'learn_xp',
              'learn_quiz_correct',
              'learn_quiz_total',
              'learn_streak',
              'learn_guided_done',
              'learning_path_done',
              'learn_skill_changes',
              'learn_skill_rhythm',
              'learn_skill_strum',
              'learn_strum_best_score',
              'learn_strum_best_rounds',
              'learn_strum_best_combo',
              'chord_training_best_streak',
              'chord_training_sessions',
              'chord_training_mastered',
              'learn_fretboard_best_streak',
              'learn_fretboard_best_score',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("FEHLER: Vollständiger Lernreset unvollständig: " + ", ".join(missing))
          if s.count('section("Lernfortschritt"') != 1:
              raise SystemExit("FEHLER: Lernfortschritt-Abschnitt mehrfach vorhanden.")
          if '.remove("chord_training_selected_chords")' in s:
              raise SystemExit("FEHLER: Gespeicherte Akkordauswahl darf beim Lernreset nicht gelöscht werden.")
          if '.remove("learn_rhythm_bpm")' in s or '.remove("learn_rhythm_meter")' in s:
              raise SystemExit("FEHLER: Rhythmus-Tempo/Taktart sind Einstellungen und bleiben erhalten.")
          print("VOLLSTÄNDIGER-LERNRESET: PASS")
          print("Zeit, Punkte, XP, Serien, Bestwerte, Lernpfad und Trainingsstatistiken werden zurückgesetzt; Einstellungen bleiben erhalten.")
          PY

      - name: Persönliches Heute-üben-Dashboard integrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/upgrade_home_training_dashboard.py

      - name: Heute-üben-Dashboard validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = (Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/de/saitenwerk/app/MainActivity.kt").read_text(encoding="utf-8")
          start = source.find("class HomeFragment : Fragment() {")
          end = source.find("\nclass SettingsFragment : Fragment() {", start)
          if start < 0 or end < 0:
              raise SystemExit("FEHLER: HomeFragment nicht gefunden")
          home = source[start:end]
          required = ["DEIN HEUTIGES TRAINING", "Training starten", "Diese Woche", "learning_path_done", "a.openSection(5)", "a.openSection(6)"]
          missing = [item for item in required if item not in home]
          if missing:
              raise SystemExit("FEHLER: Tagesdashboard unvollständig: " + ", ".join(missing))
          if home.count("DEIN HEUTIGES TRAINING") != 1:
              raise SystemExit("FEHLER: Tagesdashboard ist mehrfach eingebaut")
          print("HEUTE-ÜBEN-DASHBOARD: PASS")
          PY

      - name: Lernstudio-Fortschritt und Quiz-Zeit validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          main = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/de/saitenwerk/app/MainActivity.kt"
          s = main.read_text(encoding="utf-8")
          start = s.find("class LearnFragment : Fragment() {")
          end = s.find("\nclass PathFragment : Fragment() {", start)
          if start < 0 or end < 0:
              raise SystemExit("FEHLER: Lernstudio-Klasse nicht gefunden.")
          learn = s[start:end]

          required = [
              'fun recordPracticeDay()',
              'fun recordSession(seconds: Int)',
              'onSessionElapsed = { seconds -> recordSession(seconds) }',
              'private var rhythmStartedAt = 0L',
              'private var quizStartedAt = 0L',
              'android.os.SystemClock.elapsedRealtime()',
              'learn_daily_seconds',
              'if (started > 0L) onSessionElapsed?.invoke',
              'if (checked && previous == 0) recordPracticeDay()',
              'learn_daily_minutes',
              'learn_quiz_correct',
              'learn_quiz_total',
              'learn_best_quiz_streak',
              'Heute erledigt: $n von ${tasks.size}',
              'private fun stopRhythm()',
              'rhythmHandler?.removeCallbacksAndMessages(null)',
              'val compoundSixEight = rhythmMeter == "6/8"',
              'val beatsPerBar = if (compoundSixEight) 2',
              '90000L / rhythmBpm',
              'Zwei große Pulse pro Takt (1–2), jeweils über drei Achtel.',
          ]
          missing = [item for item in required if item not in learn]
          if missing:
              raise SystemExit("FEHLER: Lernstudio-Funktionen fehlen: " + ", ".join(missing))

          if 'next.setOnClickListener { sessionRecorded = false;' in learn:
              raise SystemExit("FEHLER: Quiz-Zeit wird beim nächsten Akkord erneut als neue Session gezählt.")

          print("LERNSTUDIO-FORTSCHRITT UND QUIZ-ZEIT: PASS")
          print("Tagesserie, Routine, Quizstatistik, Session-Erfassung und Metronom-Cleanup geprüft.")
          PY

      - name: Dauerhaften APK-Signaturschlüssel einrichten
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
          SAITENWERK_KEYSTORE_BASE64: ${{ secrets.SAITENWERK_KEYSTORE_BASE64 }}
          SAITENWERK_KEYSTORE_PASSWORD: ${{ secrets.SAITENWERK_KEYSTORE_PASSWORD }}
          SAITENWERK_KEY_ALIAS: ${{ secrets.SAITENWERK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 ci/configure_stable_signing.py


      # ------------------------------------------------------------
      # Vorhandene Funktionen des gespeicherten Projektstands prüfen
      # ------------------------------------------------------------
      - name: Liederbuch-Entfernung validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          main = root / "app/src/main/java/de/saitenwerk/app/MainActivity.kt"
          s = main.read_text(encoding="utf-8")

          forbidden = [
              'menu.add(0, 4, 3, "Lieder")',
              '"♫  Liederbuch" to 4',
              'is SongsFragment -> 4',
              '4 -> current is SongsFragment',
              '4 -> show(SongsFragment())',
          ]
          found = [x for x in forbidden if x in s]
          if found:
              raise SystemExit("FEHLER: Liederbuch ist weiterhin in der aktiven UI verdrahtet: " + ", ".join(found))

          for rel in [
              "app/src/main/assets/songs.json",
              "app/src/main/assets/public_domain_sheets.json",
              "app/src/main/res/drawable/ic_nav_songs.xml",
          ]:
              if (root / rel).exists():
                  raise SystemExit("FEHLER: Liederbuch-Ressource weiterhin im APK-Projekt vorhanden: " + rel)

          print("LIEDERBUCH-ENTFERNUNG: PASS")
          print("Keine Lieder-Navigation, kein Startseiten-Einstieg und keine Songdaten im APK-Projekt.")

          PY

      - name: Stimmgerät-Design und Bedienung optimieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/optimize_tuner_ui.py

      - name: Alternative Stimmungen als Dropdown-Menü optimieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/alternative_tuning_dropdown.py

      - name: Saitenbuttons und Referenzton-Soundengine optimieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/upgrade_reference_tone_audio.py

      - name: Echte Gitarrenaufnahmen als Referenztöne integrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/use_original_guitar_samples.py

      - name: Einheitliche Premium-Gitarren-Soundengine integrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/upgrade_premium_guitar_audio.py

      - name: Display während Stimmgerät und Übungen eingeschaltet lassen
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/keep_screen_on_during_practice.py

      - name: Dropdowns, Menüs und Kontextfenster vereinheitlichen
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/unify_menu_dialog_design.py

      - name: Akkord-Dropdowns und Kupfer-Typografie optimieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/premium_chord_dropdown_typography.py

      - name: Einstellungen und App-Informationen aktualisieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/update_about_beta_ui.py

      - name: Appweite Buttons, Schriftgrößen und Textausrichtung vereinheitlichen
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/unify_app_button_typography.py

      - name: Premium-Designsystem für Buttons, Dropdowns und Dialoge anwenden
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/premium_visual_system.py

      - name: Akkordwechsel-Auswahlrahmen vollständig darstellen
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/fix_chord_training_dropdown_clipping.py

      - name: Songpraxis-Stoppbutton vertikal zentrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/fix_songpractice_stop_button.py

      - name: Überflüssigen Stoppbutton aus Song-Praxis entfernen
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/remove_songpractice_stop_button.py

      - name: Song-Praxis Anhören-Button als Start-Stopp-Schalter optimieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/toggle_songpractice_play_stop.py

      - name: Update, Stimmungen und Premium-Oberfläche validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          update = (root / "app/src/main/java/de/saitenwerk/app/AppUpdateManager.kt").read_text(encoding="utf-8")
          main = (root / "app/src/main/java/de/saitenwerk/app/MainActivity.kt").read_text(encoding="utf-8")

          required_update = [
              "fun isNewerApk(file: File)",
              "remoteCode > currentCode",
              "archive.packageName == activity.packageName",
              "activity.startActivity(install)",
              "remove(KEY_PENDING_APK).commit()",
          ]
          missing = [x for x in required_update if x not in update]
          if missing:
              raise SystemExit("FEHLER: Update-Funktion unvollständig: " + ", ".join(missing))

          launch = update.find("activity.startActivity(install)")
          next_catch = update.find("} catch (_: Exception)", launch)
          install_block = update[launch:next_catch if next_catch >= 0 else len(update)]
          if "file.delete()" in install_block:
              raise SystemExit("FEHLER: APK-Datei wird während des Installer-Starts gelöscht.")

          required_app = [
              "private fun configureAlternativeTunings()",
              "TuningMode.CELLO",
              "Cumulative Mean Normalized Difference (YIN)",
              "class HomeFragment : Fragment()",
              "class SettingsFragment : Fragment()",
              "Stimmgerät öffnen",
              "Lernfortschritt zurücksetzen",
              "meterTempoRow",
          ]
          missing = [x for x in required_app if x not in main]
          if missing:
              raise SystemExit("FEHLER: App-Funktionen fehlen: " + ", ".join(missing))

          manifest = (root / "app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          if 'android:icon="@drawable/saitenwerk_launcher"' not in manifest:
              raise SystemExit("FEHLER: Saitenwerk-App-Symbol ist nicht im Manifest gesetzt.")
          if not (root / "app/src/main/res/drawable-nodpi/saitenwerk_launcher.png").is_file():
              raise SystemExit("FEHLER: Launcher-Logo fehlt.")

          print("UPDATE, STIMMUNGEN, YIN, PREMIUM-UI UND APP-LOGO: PASS")
          PY

      - name: Akkordwechsel-Training validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          s = (Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/de/saitenwerk/app/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              'Akkordwechsel-Training',
              'Trainingsakkorde auswählen',
              'chord_training_selected_chords',
              'chord_training_bpm',
              'chord_training_meter',
              'Taktart auswählen',
              'meterTempoRow',
              'contentDescription = chordName',
              'chord_training_best_streak',
              'Reihenfolge mischen',
              'Als Nächstes',
              'private val fretboard = ChordDiagramView(host)',
              'open class ChordDiagramView(context: android.content.Context, initialShape: ChordShape? = null)',
              'fretboard.setChord(ChordLibrary.all.firstOrNull',
              'stage.addView(fretboard, LayoutParams(-1, host.dp(210)))',
              'val fingers: IntArray = IntArray(6)',
              'fingers=intArrayOf(0,3,2,0,1,0)',
              'open class ChordDiagramView(context: android.content.Context, initialShape: ChordShape? = null)',
              'canvas.drawText(finger.toString(), x, baseline, fingerPaint)',
              '1 Zeige  ·  2 Mitte  ·  3 Ring  ·  4 Klein',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("FEHLER: Akkordwechsel-Training unvollständig: " + ", ".join(missing))
          if 'remove("chord_training_selected_chords")' in s:
              raise SystemExit("FEHLER: Trainingsakkord-Auswahl darf nicht gelöscht werden.")
          print("AKKORDWECHSEL-TRAINING: PASS")
          PY

      # ------------------------------------------------------------
      # Lernfortschritt-Reset und Akkordauswahl gegen Regressionen absichern
      # ------------------------------------------------------------
      - name: Lernfortschritt-Reset validieren
        run: |
          echo "VOLLSTÄNDIGER-LERNRESET: bereits durch den erweiterten Validierungsschritt geprüft."


      # ------------------------------------------------------------
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          # Cache bleibt erhalten; spart den zusätzlichen Gradle-Cleanup-Lauf am Job-Ende.
          cache-cleanup: never


      # ------------------------------------------------------------
      # 8. Beta-Version automatisch nummerieren
      # ------------------------------------------------------------
      - name: Beta-Version automatisch nummerieren
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((1000 + RUN_NUMBER))
          VERSION_NAME="3.1.0-beta.${RUN_NUMBER}"

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

          VERSION_CODE="$VERSION_CODE" \
          VERSION_NAME="$VERSION_NAME" \
          python3 - <<'PY2'

          import os
          import re
          from pathlib import Path

          project_dir = Path(os.environ["PROJECT_DIR"])

          p = project_dir / "app/build.gradle.kts"

          if not p.exists():
              raise SystemExit(
                  f"FEHLER: {p} nicht gefunden"
              )

          s = p.read_text(encoding="utf-8")

          s, count = re.subn(
              r'versionCode\s*=\s*\d+\s*;\s*versionName\s*=\s*"[^"]+"',
              (
                  f'versionCode = {os.environ["VERSION_CODE"]}; '
                  f'versionName = "{os.environ["VERSION_NAME"]}"'
              ),
              s,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "FEHLER: Versionseintrag in "
                  "app/build.gradle.kts nicht gefunden!"
              )

          p.write_text(s, encoding="utf-8")

          print(
              "Version erfolgreich gesetzt: "
              f"{os.environ['VERSION_NAME']}"
          )

          PY2

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 9. APK bauen
      # ------------------------------------------------------------
      - name: APK bauen
        env:
          SAITENWERK_KEYSTORE_PASSWORD: ${{ secrets.SAITENWERK_KEYSTORE_PASSWORD }}
          SAITENWERK_KEY_ALIAS: ${{ secrets.SAITENWERK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "Saitenwerk Beta wird gebaut"
          echo "=========================================="

          echo "Projekt: $PROJECT_DIR"
          echo "Version: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"

          cd "$PROJECT_DIR"
          trap 'rm -f saitenwerk-upload.jks' EXIT

          # Den Gradle-Daemon wiederverwenden und Task-Cache/Parallelisierung aktivieren.
          gradle assembleDebug --build-cache --parallel --stacktrace


      # ------------------------------------------------------------
      # 10. Dauerhaftes Build-Backup im Repository
      # ------------------------------------------------------------
      - name: Vollständigen Build-Stand dauerhaft sichern
        run: |
          set -euo pipefail

          BACKUP_DIR="build-backups/beta/build-${GITHUB_RUN_NUMBER}"
          mkdir -p "$BACKUP_DIR"

          # Exakt den tatsächlich gebauten Quellstand sichern:
          # inklusive dauerhaft integriertem Projektstand und Versionsnummer.
          tar -czf "$BACKUP_DIR/source-project.tar.gz" \
            --exclude='saitenwerk-upload.jks' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='*/build' \
            -C "$PROJECT_DIR" .

          cat > "$BACKUP_DIR/build-info.txt" <<EOF
          Product: Saitenwerk
          Track: Beta
          Build number: $GITHUB_RUN_NUMBER
          Version name: $VERSION_NAME
          Version code: $VERSION_CODE
          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Backup created (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Contents: Complete project source as built by this workflow.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$BACKUP_DIR"
          git commit -m "backup: Saitenwerk Beta build $GITHUB_RUN_NUMBER [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      # ------------------------------------------------------------
      # 11. APK als GitHub Actions Artifact bereitstellen
      # ------------------------------------------------------------
      - name: Beta-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Saitenwerk-Beta-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90


      # ------------------------------------------------------------
      # 11. Vollständiges Quellprojekt bereitstellen
      # ------------------------------------------------------------
      - name: Beta-Quellprojekt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Saitenwerk-Beta-Quellprojekt
          path: ${{ env.PROJECT_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90


      # ------------------------------------------------------------
      # 12. GitHub Release aktualisieren
      # ------------------------------------------------------------
      - name: Aktuelles Beta-Update als GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "FEHLER: APK nicht gefunden:"
            echo "$APK_PATH"
            exit 1
          fi

          cp "$APK_PATH" saitenwerk-beta.apk

          NOTES="$(
            printf \
              'Automatisches Saitenwerk Beta Update\nversionCode=%s\nversionName=%s' \
              "$VERSION_CODE" \
              "$VERSION_NAME"
          )"

          RELEASE_API="repos/$GITHUB_REPOSITORY/releases"


          # --------------------------------------------------------
          # Vorhandenes Release beta-latest suchen
          # --------------------------------------------------------

          if RELEASE_ID=$(
            gh api "$RELEASE_API/tags/beta-latest" \
              --jq .id 2>/dev/null
          ); then

            echo "Vorhandenes Alpha-Release $RELEASE_ID wird aktualisiert."

            gh api "$RELEASE_API/$RELEASE_ID" \
              --method PATCH \
              -f name="Saitenwerk Beta – aktueller Stand" \
              -f body="$NOTES" \
              -F prerelease=true \
              >/dev/null

          else

            echo "Alpha-Release wird mit dem festen Tag beta-latest angelegt."

            gh api "$RELEASE_API" \
              --method POST \
              -f tag_name="beta-latest" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Saitenwerk Beta – aktueller Stand" \
              -f body="$NOTES" \
              -F prerelease=true \
              >/dev/null

          fi


          # --------------------------------------------------------
          # APK veröffentlichen
          # --------------------------------------------------------

          gh release upload \
            beta-latest \
            saitenwerk-beta.apk \
            --clobber

          echo ""
          echo "=========================================="
          echo "Release erfolgreich veröffentlicht"
          echo "=========================================="
          echo "Datei: saitenwerk-beta.apk"
          echo "Version: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
