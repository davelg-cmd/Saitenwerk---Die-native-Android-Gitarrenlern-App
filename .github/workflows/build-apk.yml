name: Saitenwerk Beta - APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

# Serialize builds so backup commits and release uploads cannot race each other.
concurrency:
  group: saitenwerk-beta-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      # ------------------------------------------------------------
      # 1. Repository auschecken
      # ------------------------------------------------------------
      - name: Repository herunterladen
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Java 17
      # ------------------------------------------------------------
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ------------------------------------------------------------
      # 3. Android SDK
      # ------------------------------------------------------------
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      # ------------------------------------------------------------
      # 4. Android SDK Pakete installieren
      # ------------------------------------------------------------
      - name: Android SDK Pakete installieren
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ------------------------------------------------------------
      # 5. Beta-Projekt finden und entpacken
      # ------------------------------------------------------------
      - name: Beta-Projekt finden und entpacken
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          # Verbindliche Quelle: exakt das geprüfte Songplayer-V3-Archiv.
          ZIP_FILE="./Saitenwerk_ALPHA_7_Songplayer_V3_Start_Originaltempo_Realistic.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "FEHLER: Verbindliches Songplayer-V3-Archiv fehlt: $ZIP_FILE"
            exit 1
          fi

          echo "Projektarchiv: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=""

          while IFS= read -r file; do
            case "$file" in
              */settings.gradle.kts|*/settings.gradle)
                PROJECT_FILE="$file"
                break
                ;;
            esac
          done < <(find extracted -type f)

          if [ -z "$PROJECT_FILE" ]; then
            echo "FEHLER: Keine Gradle-Projektdatei gefunden!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Projektverzeichnis: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 5a. Einstellungen nach unten verschieben und Über-Seite aktualisieren
      # ------------------------------------------------------------
      - name: Startseite und Über-Bereich aktualisieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/update_about_beta_ui.py

      # ------------------------------------------------------------
      # 5a. Transparentes Startseiten-Logo integrieren
      # ------------------------------------------------------------
      - name: Transparentes Startseiten-Logo integrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/integrate_home_logo.py


      # ------------------------------------------------------------
      # 5b. Saitenwerk App-Logo setzen
      # ------------------------------------------------------------
      - name: Saitenwerk App-Logo integrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          RES_DIR="$PROJECT_DIR/app/src/main/res"
          mkdir -p "$RES_DIR/drawable-nodpi"
          cp "$GITHUB_WORKSPACE/assets/saitenwerk_launcher.png" "$RES_DIR/drawable-nodpi/saitenwerk_launcher.png"
          # Das alte Vektor-Icon darf nicht parallel denselben Ressourcennamen belegen.
          rm -f "$RES_DIR/drawable/saitenwerk_launcher.xml"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "FEHLER: AndroidManifest.xml nicht gefunden: $MANIFEST"
            exit 1
          fi
          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import re, sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          icon = "@drawable/saitenwerk_launcher"

          # android:icon ersetzen oder neu in <application> einfügen.
          if re.search(r'android:icon\s*=\s*"[^"]+"', s):
              s = re.sub(
                  r'android:icon\s*=\s*"[^"]+"',
                  f'android:icon="{icon}"',
                  s,
                  count=1
              )
              print("APP-LOGO: vorhandenes android:icon aktualisiert")
          else:
              match = re.search(r'<application\b[^>]*>', s)
              if not match:
                  raise SystemExit("FEHLER: Kein <application>-Element im Manifest gefunden.")

              application = match.group(0)
              replacement = application[:-1] + f' android:icon="{icon}">'
              s = s[:match.start()] + replacement + s[match.end():]
              print("APP-LOGO: android:icon neu eingefügt")

          # android:roundIcon ersetzen oder neu in <application> einfügen.
          if re.search(r'android:roundIcon\s*=\s*"[^"]+"', s):
              s = re.sub(
                  r'android:roundIcon\s*=\s*"[^"]+"',
                  f'android:roundIcon="{icon}"',
                  s,
                  count=1
              )
              print("APP-LOGO: vorhandenes android:roundIcon aktualisiert")
          else:
              match = re.search(r'<application\b[^>]*>', s)
              if not match:
                  raise SystemExit("FEHLER: Kein <application>-Element im Manifest gefunden.")

              application = match.group(0)
              replacement = application[:-1] + f' android:roundIcon="{icon}">'
              s = s[:match.start()] + replacement + s[match.end():]
              print("APP-LOGO: android:roundIcon neu eingefügt")

          p.write_text(s, encoding="utf-8")
          print("APP-LOGO: neues Saitenwerk-Gitarrenmotiv gesetzt")
          PY
          echo "App-Logo erfolgreich integriert."

      - name: Dauerhaften APK-Signaturschlüssel einrichten
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
          SAITENWERK_KEYSTORE_BASE64: ${{ secrets.SAITENWERK_KEYSTORE_BASE64 }}
          SAITENWERK_KEYSTORE_PASSWORD: ${{ secrets.SAITENWERK_KEYSTORE_PASSWORD }}
          SAITENWERK_KEY_ALIAS: ${{ secrets.SAITENWERK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 ci/configure_stable_signing.py


      # ------------------------------------------------------------
      # 5a. Liederbuch bewusst aus der aktuellen Alpha entfernen
      # ------------------------------------------------------------
      - name: Liederbuch aus der App entfernen
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/remove_songbook.py

      # ------------------------------------------------------------
      # 5b. Entfernten Funktionsbereich verifizieren
      # ------------------------------------------------------------
      - name: Liederbuch-Entfernung validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          main = root / "app/src/main/java/de/saitenwerk/app/MainActivity.kt"
          s = main.read_text(encoding="utf-8")

          forbidden = [
              'menu.add(0, 4, 3, "Lieder")',
              '"♫  Liederbuch" to 4',
              'is SongsFragment -> 4',
              '4 -> current is SongsFragment',
              '4 -> show(SongsFragment())',
              'fun openSong(song: Song)',
          ]
          found = [x for x in forbidden if x in s]
          if found:
              raise SystemExit("FEHLER: Liederbuch ist weiterhin in der aktiven UI verdrahtet: " + ", ".join(found))

          for rel in [
              "app/src/main/assets/songs.json",
              "app/src/main/assets/public_domain_sheets.json",
              "app/src/main/res/drawable/ic_nav_songs.xml",
          ]:
              if (root / rel).exists():
                  raise SystemExit("FEHLER: Liederbuch-Ressource weiterhin im APK-Projekt vorhanden: " + rel)

          print("LIEDERBUCH-ENTFERNUNG: PASS")
          print("Keine Lieder-Navigation, kein Startseiten-Einstieg und keine Songdaten im APK-Projekt.")

          PY

      # ------------------------------------------------------------
      # Legacy-Songcode nur noch kompilierbar halten
      # Die Lieder-UI und Songdaten sind bereits entfernt. Der alte Code
      # bleibt vorerst im Archiv, bis wir später eine komplett neue Lösung bauen.
      # ------------------------------------------------------------
      - name: Legacy-Songcode Compile-Kompatibilität
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/keep_legacy_song_compile_compat.py

      # ------------------------------------------------------------
      # Frei konfigurierbare Akkordauswahl im Wechseltraining
      # ------------------------------------------------------------
      - name: Akkordwechsel-Training um Akkordauswahl erweitern
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/add_chord_training_selection.py

      # ------------------------------------------------------------
      # Update-Installationsschleife dauerhaft verhindern
      # ------------------------------------------------------------
      - name: Android-Update-Loop-Fix anwenden und validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/fix_update_install_loop.py


      # Alternative Stimmungen für alle Instrumente + Beta-Update-Erkennung
      # ------------------------------------------------------------
      - name: Instrument-Stimmungen und Beta-Update-Funktion aktualisieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/upgrade_tuner_and_beta_updates.py


      # 7. Gradle einrichten
      # ------------------------------------------------------------
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          # Cache bleibt erhalten; spart den zusätzlichen Gradle-Cleanup-Lauf am Job-Ende.
          cache-cleanup: never


      # ------------------------------------------------------------
      # 8. Beta-Version automatisch nummerieren
      # ------------------------------------------------------------
      - name: Beta-Version automatisch nummerieren
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((1000 + RUN_NUMBER))
          VERSION_NAME="3.1.0-beta.${RUN_NUMBER}"

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

          VERSION_CODE="$VERSION_CODE" \
          VERSION_NAME="$VERSION_NAME" \
          python3 - <<'PY2'

          import os
          import re
          from pathlib import Path

          project_dir = Path(os.environ["PROJECT_DIR"])

          p = project_dir / "app/build.gradle.kts"

          if not p.exists():
              raise SystemExit(
                  f"FEHLER: {p} nicht gefunden"
              )

          s = p.read_text(encoding="utf-8")

          s, count = re.subn(
              r'versionCode\s*=\s*\d+\s*;\s*versionName\s*=\s*"[^"]+"',
              (
                  f'versionCode = {os.environ["VERSION_CODE"]}; '
                  f'versionName = "{os.environ["VERSION_NAME"]}"'
              ),
              s,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "FEHLER: Versionseintrag in "
                  "app/build.gradle.kts nicht gefunden!"
              )

          p.write_text(s, encoding="utf-8")

          print(
              "Version erfolgreich gesetzt: "
              f"{os.environ['VERSION_NAME']}"
          )

          PY2

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 9. APK bauen
      # ------------------------------------------------------------
      - name: APK bauen
        env:
          SAITENWERK_KEYSTORE_PASSWORD: ${{ secrets.SAITENWERK_KEYSTORE_PASSWORD }}
          SAITENWERK_KEY_ALIAS: ${{ secrets.SAITENWERK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "Saitenwerk Beta wird gebaut"
          echo "=========================================="

          echo "Projekt: $PROJECT_DIR"
          echo "Version: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"

          cd "$PROJECT_DIR"
          trap 'rm -f saitenwerk-upload.jks' EXIT

          # Den Gradle-Daemon wiederverwenden und Task-Cache/Parallelisierung aktivieren.
          gradle assembleDebug --build-cache --parallel --stacktrace


      # ------------------------------------------------------------
      # 10. Dauerhaftes Build-Backup im Repository
      # ------------------------------------------------------------
      - name: Vollständigen Build-Stand dauerhaft sichern
        run: |
          set -euo pipefail

          BACKUP_DIR="build-backups/beta/build-${GITHUB_RUN_NUMBER}"
          mkdir -p "$BACKUP_DIR"

          # Exakt den tatsächlich gebauten Quellstand sichern:
          # inklusive CI-Fixes und automatisch gesetzter Versionsnummer.
          tar -czf "$BACKUP_DIR/source-project.tar.gz" \
            --exclude='saitenwerk-upload.jks' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='*/build' \
            -C "$PROJECT_DIR" .

          cat > "$BACKUP_DIR/build-info.txt" <<EOF
          Product: Saitenwerk
          Track: Beta
          Build number: $GITHUB_RUN_NUMBER
          Version name: $VERSION_NAME
          Version code: $VERSION_CODE
          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Backup created (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Contents: Complete project source as built by this workflow.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$BACKUP_DIR"
          git commit -m "backup: Saitenwerk Beta build $GITHUB_RUN_NUMBER [skip ci]"
          git push

      # ------------------------------------------------------------
      # 11. APK als GitHub Actions Artifact bereitstellen
      # ------------------------------------------------------------
      - name: Beta-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Saitenwerk-Beta-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90


      # ------------------------------------------------------------
      # 11. Vollständiges Quellprojekt bereitstellen
      # ------------------------------------------------------------
      - name: Beta-Quellprojekt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Saitenwerk-Beta-Quellprojekt
          path: ${{ env.PROJECT_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90


      # ------------------------------------------------------------
      # 12. GitHub Release aktualisieren
      # ------------------------------------------------------------
      - name: Aktuelles Beta-Update als GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "FEHLER: APK nicht gefunden:"
            echo "$APK_PATH"
            exit 1
          fi

          cp "$APK_PATH" saitenwerk-beta.apk

          NOTES="$(
            printf \
              'Automatisches Saitenwerk Beta Update\nversionCode=%s\nversionName=%s' \
              "$VERSION_CODE" \
              "$VERSION_NAME"
          )"

          RELEASE_API="repos/$GITHUB_REPOSITORY/releases"


          # --------------------------------------------------------
          # Vorhandenes Release beta-latest suchen
          # --------------------------------------------------------

          if RELEASE_ID=$(
            gh api "$RELEASE_API/tags/beta-latest" \
              --jq .id 2>/dev/null
          ); then

            echo "Vorhandenes Alpha-Release $RELEASE_ID wird aktualisiert."

            gh api "$RELEASE_API/$RELEASE_ID" \
              --method PATCH \
              -f name="Saitenwerk Beta – aktueller Stand" \
              -f body="$NOTES" \
              -F prerelease=true \
              >/dev/null

          else

            echo "Alpha-Release wird mit dem festen Tag beta-latest angelegt."

            gh api "$RELEASE_API" \
              --method POST \
              -f tag_name="beta-latest" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Saitenwerk Beta – aktueller Stand" \
              -f body="$NOTES" \
              -F prerelease=true \
              >/dev/null

          fi


          # --------------------------------------------------------
          # APK veröffentlichen
          # --------------------------------------------------------

          gh release upload \
            beta-latest \
            saitenwerk-beta.apk \
            --clobber

          echo ""
          echo "=========================================="
          echo "Release erfolgreich veröffentlicht"
          echo "=========================================="
          echo "Datei: saitenwerk-beta.apk"
          echo "Version: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
