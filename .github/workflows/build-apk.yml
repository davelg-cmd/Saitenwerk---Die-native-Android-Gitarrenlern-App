
name: Saitenwerk Alpha 6 - APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: SDK Pakete installieren
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: ZIP-Datei finden und entpacken
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "FEHLER: Keine ZIP-Datei gefunden!"
            exit 1
          fi

          echo "Gefundene ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Android-Projekt finden
        run: |
          PROJECT_DIR=$(dirname "$(find extracted \
            -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "extracted" ]; then
            if [ -f "extracted/settings.gradle.kts" ] || [ -f "extracted/settings.gradle" ]; then
              PROJECT_DIR="extracted"
            else
              echo "FEHLER: Android-Projekt nicht gefunden!"
              find extracted -maxdepth 4 -type f | head -100
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projekt gefunden: $PROJECT_DIR"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android APK bauen
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Saitenwerk-Alpha-6-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

