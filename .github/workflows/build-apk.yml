name: Saitenwerk Alpha 7 - APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

# Serialize builds so backup commits and release uploads cannot race each other.
concurrency:
  group: saitenwerk-alpha7-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Repository auschecken
      # ------------------------------------------------------------
      - name: Repository herunterladen
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Java 17
      # ------------------------------------------------------------
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ------------------------------------------------------------
      # 3. Android SDK
      # ------------------------------------------------------------
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      # ------------------------------------------------------------
      # 4. Android SDK Pakete installieren
      # ------------------------------------------------------------
      - name: Android SDK Pakete installieren
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ------------------------------------------------------------
      # 5. Alpha-7-Projekt finden und entpacken
      # ------------------------------------------------------------
      - name: Alpha-7-Projekt finden und entpacken
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          # Verbindliche Quelle: exakt das geprüfte Songplayer-V3-Archiv.
          ZIP_FILE="./Saitenwerk_ALPHA_7_Songplayer_V3_Start_Originaltempo_Realistic.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "FEHLER: Verbindliches Songplayer-V3-Archiv fehlt: $ZIP_FILE"
            exit 1
          fi

          echo "Projektarchiv: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=""

          while IFS= read -r file; do
            case "$file" in
              */settings.gradle.kts|*/settings.gradle)
                PROJECT_FILE="$file"
                break
                ;;
            esac
          done < <(find extracted -type f)

          if [ -z "$PROJECT_FILE" ]; then
            echo "FEHLER: Keine Gradle-Projektdatei gefunden!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Projektverzeichnis: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Dauerhaften APK-Signaturschlüssel einrichten
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
          SAITENWERK_KEYSTORE_BASE64: ${{ secrets.SAITENWERK_KEYSTORE_BASE64 }}
          SAITENWERK_KEYSTORE_PASSWORD: ${{ secrets.SAITENWERK_KEYSTORE_PASSWORD }}
          SAITENWERK_KEY_ALIAS: ${{ secrets.SAITENWERK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 ci/configure_stable_signing.py


      # ------------------------------------------------------------
      # 5a. Verbindliche Inhaltsprüfung vor jedem Build
      # ------------------------------------------------------------
      - name: Songplayer-V3-Quellstand validieren
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ.get("PROJECT_DIR", ""))
          if not root.is_dir():
              raise SystemExit("FEHLER: Projektverzeichnis fehlt.")

          kotlin_files = list(root.rglob("MainActivity.kt"))
          if len(kotlin_files) != 1:
              raise SystemExit(
                  f"FEHLER: Erwartet genau eine MainActivity.kt, gefunden: {len(kotlin_files)}"
              )

          source = kotlin_files[0].read_text(encoding="utf-8")
          required = {
              "SongDetailFragment": "class SongDetailFragment",
              "GuitarPlayerEngine": "class GuitarPlayerEngine",
              "Song-Wiedergabe": "fun playSong(",
              "Start-Schaltfläche": 'button("Start")',
          }
          missing = [label for label, token in required.items() if token not in source]
          if missing:
              raise SystemExit(
                  "FEHLER: Songplayer-V3-Quellprüfung fehlgeschlagen: "
                  + ", ".join(missing)
              )

          data_file = root / "app/src/main/assets/songs.json"
          if not data_file.is_file():
              raise SystemExit("FEHLER: Songdatenbank fehlt.")
          songs = json.loads(data_file.read_text(encoding="utf-8"))
          if not isinstance(songs, list) or not songs:
              raise SystemExit("FEHLER: Songdatenbank ist leer oder ungültig.")

          print("QUELLPRÜFUNG ERFOLGREICH")
          print("Songplayer: SongDetailFragment vorhanden")
          print("Audioengine: GuitarPlayerEngine vorhanden")
          print("Wiedergabefunktion: playSong vorhanden")
          print("Zentraler Button: Start vorhanden")
          print(f"Songdatensätze im geprüften Archiv: {len(songs)}")
          print("Hinweis: Diese Prüfung ersetzt keinen Gerätetest und keinen Hörtest.")
          PY

      # ------------------------------------------------------------
      # 6. V3 Kotlin Build-Fix
      #
      # Behebt die beim V3-Build fehlenden Variablen:
      # autoScroll
      # scrollRunnable
      # scrollHandler
      # lastScrollTime
      # scrollRemainder
      # resumeAfterTouch
      #
      # Zusätzlich werden problematische direkte progress-
      # Zuweisungen in SeekBar/ProgressBar auf setProgress()
      # umgestellt.
      # ------------------------------------------------------------
      - name: V3-Kotlin-Build-Fix automatisch anwenden
        run: |
          python3 - <<'PY'
          from pathlib import Path

          print("=== Saitenwerk V3 Build-Fix ===")

          roots = [
              Path("extracted"),
              Path(".")
          ]

          matches = []

          for root in roots:
              if root.exists():
                  matches.extend(root.rglob("MainActivity.kt"))

          # Doppelte Treffer entfernen
          matches = list(dict.fromkeys(matches))

          if not matches:
              raise SystemExit(
                  "FEHLER: MainActivity.kt nicht gefunden!"
              )

          print("Gefundene MainActivity.kt-Dateien:")

          for match in matches:
              print(f"  - {match}")

          # Die MainActivity des entpackten Projektes bevorzugen
          extracted_matches = [
              p for p in matches
              if str(p).startswith("extracted/")
          ]

          if extracted_matches:
              p = extracted_matches[0]
          else:
              p = matches[0]

          print(f"Verwende: {p}")

          s = p.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Fehlende SongDetailFragment-Zustände wiederherstellen
          # --------------------------------------------------------

          fields = """    private var autoScroll: Boolean = false
              private var scrollRunnable: Runnable? = null
              private val scrollHandler = Handler(Looper.getMainLooper())
              private var lastScrollTime: Long = 0L
              private var scrollRemainder: Float = 0f
              private var resumeAfterTouch: Boolean = false
          """

          marker = "class SongDetailFragment"

          if "private var autoScroll: Boolean" not in s:

              i = s.find(marker)

              if i < 0:
                  raise SystemExit(
                      "FEHLER: SongDetailFragment nicht gefunden!"
                  )

              i = s.find("\n", i)

              if i < 0:
                  raise SystemExit(
                      "FEHLER: Position zum Einfügen der V3-Felder nicht gefunden!"
                  )

              i += 1

              s = s[:i] + fields + s[i:]

              print(
                  "OK: Fehlende SongDetailFragment-Variablen wurden ergänzt."
              )

          else:
              print(
                  "OK: SongDetailFragment-Variablen sind bereits vorhanden."
              )


          # --------------------------------------------------------
          # ProgressBar / SeekBar:
          # direkte progress-Zuweisungen vermeiden
          # --------------------------------------------------------

          old_1 = "apply { max = 100; progress = 0 }"
          new_1 = "apply { max = 100; setProgress(0) }"

          if old_1 in s:
              s = s.replace(old_1, new_1)
              print("OK: progress = 0 auf setProgress(0) umgestellt.")
          else:
              print("INFO: progress = 0 Muster nicht vorhanden.")


          old_2 = "apply { max = 56; progress = 16 }"
          new_2 = "apply { max = 56; setProgress(16) }"

          if old_2 in s:
              s = s.replace(old_2, new_2)
              print("OK: progress = 16 auf setProgress(16) umgestellt.")
          else:
              print("INFO: progress = 16 Muster nicht vorhanden.")


          # --------------------------------------------------------
          # Datei speichern
          # --------------------------------------------------------

          p.write_text(s, encoding="utf-8")

          print("")
          print("V3-Fix erfolgreich angewendet.")
          print(f"Datei: {p}")


          # --------------------------------------------------------
          # Sicherheitsprüfung
          # --------------------------------------------------------

          required = [
              "autoScroll",
              "scrollRunnable",
              "scrollHandler",
              "lastScrollTime",
              "scrollRemainder",
              "resumeAfterTouch",
          ]

          missing = [
              name for name in required
              if name not in s
          ]

          if missing:
              raise SystemExit(
                  "FEHLER: Folgende V3-Variablen fehlen weiterhin: "
                  + ", ".join(missing)
              )

          print("")
          print("=== V3-Fix-Prüfung erfolgreich ===")

          PY


      # ------------------------------------------------------------
      # 6a. Zentrale SongTimeline als Master-Zeitbasis
      # ------------------------------------------------------------
      - name: SongTimeline integrieren und validieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/apply_song_timeline.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/de/saitenwerk/app/MainActivity.kt"
          s = p.read_text(encoding="utf-8")
          required = [
              "private data class SongTimeline(",
              "timeline: SongTimeline,",
              "fun buildPlayerTimeline(raw: String): SongTimeline",
              "currentTimeline?.chordIndexAt(position.toLong())",
              "currentTimeline?.progressAt(position.toLong())",
          ]
          missing = [token for token in required if token not in s]
          if missing:
              raise SystemExit("SongTimeline-Prüfung fehlgeschlagen: " + ", ".join(missing))
          print("SONGTIMELINE MASTER-CLOCK CHECK: PASS")
          print("Audio, Akkordmarkierung und Fortschritt nutzen dieselbe Zeitachse.")
          PY


      # ------------------------------------------------------------
      # 6b. Änderungen am Songblatt gegen laufende Audiozeit absichern
      # ------------------------------------------------------------
      - name: SongTimeline bei Songblatt-Änderungen schützen
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/guard_song_timeline_edits.py

      # ------------------------------------------------------------
      # 6c. Natürlichere gezupfte Saiten statt additiver Sinustöne
      # ------------------------------------------------------------
      - name: Realistischeres Gitarren-Pluckmodell integrieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/improve_guitar_pluck.py

      - name: Bass-Saiten und Audio-Masterclock korrigieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/fix_guitar_bass_cache.py

      - name: Songansicht, Zurück-Navigation und Audio-Cleanup korrigieren
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/fix_song_detail_navigation.py

      - name: Echte Gitarrensamples (CC0) vorbereiten
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 ci/prepare_guitar_samples.py

      - name: Songplayer auf echte Gitarrensamples umstellen
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 ci/use_real_guitar_samples.py


      # ------------------------------------------------------------
      # 7. Gradle einrichten
      # ------------------------------------------------------------
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ------------------------------------------------------------
      # 8. Alpha-Version automatisch nummerieren
      # ------------------------------------------------------------
      - name: Alpha-Version automatisch nummerieren
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((1000 + RUN_NUMBER))
          VERSION_NAME="3.1.0-alpha7.${RUN_NUMBER}"

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

          VERSION_CODE="$VERSION_CODE" \
          VERSION_NAME="$VERSION_NAME" \
          python3 - <<'PY2'

          import os
          import re
          from pathlib import Path

          project_dir = Path(os.environ["PROJECT_DIR"])

          p = project_dir / "app/build.gradle.kts"

          if not p.exists():
              raise SystemExit(
                  f"FEHLER: {p} nicht gefunden"
              )

          s = p.read_text(encoding="utf-8")

          s, count = re.subn(
              r'versionCode\s*=\s*\d+\s*;\s*versionName\s*=\s*"[^"]+"',
              (
                  f'versionCode = {os.environ["VERSION_CODE"]}; '
                  f'versionName = "{os.environ["VERSION_NAME"]}"'
              ),
              s,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "FEHLER: Versionseintrag in "
                  "app/build.gradle.kts nicht gefunden!"
              )

          p.write_text(s, encoding="utf-8")

          print(
              "Version erfolgreich gesetzt: "
              f"{os.environ['VERSION_NAME']}"
          )

          PY2

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 9. APK bauen
      # ------------------------------------------------------------
      - name: APK bauen
        env:
          SAITENWERK_KEYSTORE_PASSWORD: ${{ secrets.SAITENWERK_KEYSTORE_PASSWORD }}
          SAITENWERK_KEY_ALIAS: ${{ secrets.SAITENWERK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "Saitenwerk Alpha 7 wird gebaut"
          echo "=========================================="

          echo "Projekt: $PROJECT_DIR"
          echo "Version: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"

          cd "$PROJECT_DIR"
          trap 'rm -f saitenwerk-upload.jks' EXIT

          gradle --no-daemon assembleDebug --stacktrace


      # ------------------------------------------------------------
      # 10. Dauerhaftes Build-Backup im Repository
      # ------------------------------------------------------------
      - name: Vollständigen Build-Stand dauerhaft sichern
        run: |
          set -euo pipefail

          BACKUP_DIR="build-backups/alpha7/build-${GITHUB_RUN_NUMBER}"
          mkdir -p "$BACKUP_DIR"

          # Exakt den tatsächlich gebauten Quellstand sichern:
          # inklusive CI-Fixes und automatisch gesetzter Versionsnummer.
          tar -czf "$BACKUP_DIR/source-project.tar.gz" \
            --exclude='saitenwerk-upload.jks' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='*/build' \
            -C "$PROJECT_DIR" .

          cat > "$BACKUP_DIR/build-info.txt" <<EOF
          Product: Saitenwerk
          Track: Alpha 7
          Build number: $GITHUB_RUN_NUMBER
          Version name: $VERSION_NAME
          Version code: $VERSION_CODE
          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Backup created (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Contents: Complete project source as built by this workflow.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$BACKUP_DIR"
          git commit -m "backup: Saitenwerk Alpha 7 build $GITHUB_RUN_NUMBER [skip ci]"
          git push

      # ------------------------------------------------------------
      # 11. APK als GitHub Actions Artifact bereitstellen
      # ------------------------------------------------------------
      - name: Alpha-7-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Saitenwerk-Alpha-7-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90


      # ------------------------------------------------------------
      # 11. Vollständiges Quellprojekt bereitstellen
      # ------------------------------------------------------------
      - name: Alpha-7-Quellprojekt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Saitenwerk-Alpha-7-Quellprojekt
          path: ${{ env.PROJECT_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90


      # ------------------------------------------------------------
      # 12. GitHub Release aktualisieren
      # ------------------------------------------------------------
      - name: Aktuelles Alpha-Update als GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "FEHLER: APK nicht gefunden:"
            echo "$APK_PATH"
            exit 1
          fi

          cp "$APK_PATH" saitenwerk-alpha7.apk

          NOTES="$(
            printf \
              'Automatisches Saitenwerk Alpha 7 Update\nversionCode=%s\nversionName=%s' \
              "$VERSION_CODE" \
              "$VERSION_NAME"
          )"

          RELEASE_API="repos/$GITHUB_REPOSITORY/releases"


          # --------------------------------------------------------
          # Vorhandenes Release alpha-latest suchen
          # --------------------------------------------------------

          if RELEASE_ID=$(
            gh api "$RELEASE_API/tags/alpha-latest" \
              --jq .id 2>/dev/null
          ); then

            echo "Vorhandenes Alpha-Release $RELEASE_ID wird aktualisiert."

            gh api "$RELEASE_API/$RELEASE_ID" \
              --method PATCH \
              -f name="Saitenwerk Alpha 7 – aktueller Stand" \
              -f body="$NOTES" \
              -F prerelease=true \
              >/dev/null

          else

            echo "Alpha-Release wird mit dem festen Tag alpha-latest angelegt."

            gh api "$RELEASE_API" \
              --method POST \
              -f tag_name="alpha-latest" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Saitenwerk Alpha 7 – aktueller Stand" \
              -f body="$NOTES" \
              -F prerelease=true \
              >/dev/null

          fi


          # --------------------------------------------------------
          # APK veröffentlichen
          # --------------------------------------------------------

          gh release upload \
            alpha-latest \
            saitenwerk-alpha7.apk \
            --clobber

          echo ""
          echo "=========================================="
          echo "Release erfolgreich veröffentlicht"
          echo "=========================================="
          echo "Datei: saitenwerk-alpha7.apk"
          echo "Version: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
